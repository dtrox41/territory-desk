name: Apply verified release corrections

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-verified-release-corrections
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'dtrox41/territory-desk'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_PARENT: 4be99f735af59235da79765e949ded9ecafca15c
      PATCH_SHA256: 9ea5463a2a8be539b09ac49db00261f7f9c70b66bbebfea7a4cce9d518eacdb1
      PATCH_BASE64: ""
    steps:
      - name: Check out the exact correction source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Verify the correction boundary
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/import-history.yml"
          test -z "$(git status --short)"

      - name: Verify and apply the tested patch
        shell: bash
        run: |
          patch_file="$RUNNER_TEMP/territory-desk-release-corrections.patch"
          printf '%s' "$PATCH_BASE64" | base64 --decode > "$patch_file"
          printf '%s  %s\n' "$PATCH_SHA256" "$patch_file" | sha256sum --check
          git apply --check "$patch_file"
          git apply "$patch_file"
          git diff --check

      - name: Commit only the approved files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components/shell/AppShell.test.tsx app/components/shell/AppShell.tsx app/features/territory/TerritoryLookup.test.tsx app/features/territory/TerritoryResults.tsx e2e/scaffold.spec.ts
          actual_paths="$(git diff --cached --name-only | paste -sd '|' -)"
          expected_paths="app/components/shell/AppShell.test.tsx|app/components/shell/AppShell.tsx|app/features/territory/TerritoryLookup.test.tsx|app/features/territory/TerritoryResults.tsx|e2e/scaffold.spec.ts"
          test "$actual_paths" = "$expected_paths"
          git commit -m "test: harden cross-device release gate"
          git push origin HEAD:main
