name: Apply verified release corrections

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-verified-release-corrections
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'dtrox41/territory-desk'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_PARENT: ab18131cb74b047acdbba023f9890ec888589279
      PATCH_SHA256: 318a55d906195ffcf58fc3cbc149f5a47a25698db2b0914791c4980bd717259b
      PATCH_BASE64: ""
    steps:
      - name: Check out the exact correction source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Verify the correction boundary
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/import-history.yml"
          test -z "$(git status --short)"

      - name: Verify and apply the tested patch
        shell: bash
        run: |
          patch_file="$RUNNER_TEMP/territory-desk-release-corrections.patch"
          printf '%s' "$PATCH_BASE64" | base64 --decode > "$patch_file"
          printf '%s  %s\n' "$PATCH_SHA256" "$patch_file" | sha256sum --check
          git apply --check "$patch_file"
          git apply "$patch_file"
          git diff --check

      - name: Commit only the approved files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/features/authentication/AuthenticationSystem.test.tsx app/features/leads/LeadsList.test.tsx app/features/leads/LeadsList.tsx e2e/scaffold.spec.ts
          actual_paths="$(git diff --cached --name-only | paste -sd '|' -)"
          expected_paths="app/features/authentication/AuthenticationSystem.test.tsx|app/features/leads/LeadsList.test.tsx|app/features/leads/LeadsList.tsx|e2e/scaffold.spec.ts"
          test "$actual_paths" = "$expected_paths"
          git commit -m "fix: finalize cross-device accessibility gate"
          git push origin HEAD:main
