<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B4B91" />
    <title>Territory Desk offline fallback</title>
    <style>
      :root {
        color: #172435;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        align-items: center;
        background: #f4f7fb;
        display: grid;
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        padding: max(1.5rem, env(safe-area-inset-top)) 1rem
          max(1.5rem, env(safe-area-inset-bottom));
      }

      main {
        background: #fff;
        border: 1px solid #cbd8e8;
        border-radius: 1rem;
        box-shadow: 0 0.5rem 1.5rem rgba(16, 45, 82, 0.12);
        margin: auto;
        max-width: 32rem;
        padding: 2rem;
        width: 100%;
      }

      .mark {
        align-items: center;
        background: #0b4b91;
        border-radius: 0.875rem;
        color: #fff;
        display: inline-flex;
        font-size: 1.125rem;
        font-weight: 800;
        height: 3rem;
        justify-content: center;
        letter-spacing: -0.03em;
        width: 3rem;
      }

      h1 {
        color: #102d52;
        font-size: 1.75rem;
        line-height: 1.2;
        margin: 1.25rem 0 0.75rem;
      }

      p {
        color: #44566c;
        line-height: 1.55;
        margin: 0 0 1.5rem;
      }

      button {
        background: #0b4b91;
        border: 2px solid #0b4b91;
        border-radius: 0.5rem;
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        min-height: 3rem;
        padding: 0.625rem 1.25rem;
      }

      button:focus-visible {
        outline: 3px solid #e6a700;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <span aria-hidden="true" class="mark">TD</span>
      <h1>You’re currently offline</h1>
      <p>
        Territory Desk cannot retrieve new information without a connection.
        Reconnect before sending or updating a lead so no business action is
        lost.
      </p>
      <button onclick="window.location.reload()" type="button">
        Try again
      </button>
    </main>
  </body>
</html>
